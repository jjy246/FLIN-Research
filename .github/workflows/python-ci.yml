name: FLIN source checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile flin_desktop.py scripts/build_native.py scripts/check_environment.py tests/test_core.py
      - name: Validate repository documentation links
        run: python scripts/validate_repo.py
      - name: Run offline FLIN core tests
        run: python -m unittest discover -s tests -v
      - name: Offline synthetic FLIN learning demonstration
        run: python scripts/demo_offline.py
      - name: Linux virtual-display GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_gui.py
      - name: Cross-platform CLI smoke checks
        run: |
          python flin_desktop.py --help
          python flin_desktop.py --cpu-info
          python scripts/check_environment.py
